<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WireGuard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="hidden">
        <div class="wg-window">
            <header class="wg-header">
                <div class="wg-brand">
                    <span class="wg-logo">🛡️</span>
                    <div>
                        <h1>WireGuard</h1>
                        <small id="serverName">Anticheat Admin</small>
                    </div>
                </div>
                <nav class="wg-tabs">
                    <button class="tab active" data-tab="players">Players</button>
                    <button class="tab" data-tab="feed">Live Feed</button>
                </nav>
                <button id="closeBtn" class="wg-close">✕</button>
            </header>

            <!-- Players -->
            <section id="tab-players" class="wg-panel">
                <div class="wg-toolbar">
                    <input id="search" placeholder="Search player..." />
                    <button id="refreshBtn">⟳ Refresh</button>
                    <span id="count" class="wg-count">0 online</span>
                </div>
                <div class="wg-table-wrap">
                    <table class="wg-table">
                        <thead>
                            <tr>
                                <th>ID</th><th>Name</th><th title="Start bei 100. Aktivierte Detections ziehen ihre konfigurierte Strafe ab.">Trust-Score ⓘ</th>
                                <th>Flags</th><th>Ping</th><th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="playerRows"></tbody>
                    </table>
                </div>
            </section>

            <!-- Feed -->
            <section id="tab-feed" class="wg-panel hidden">
                <div class="wg-feed" id="feedList"></div>
            </section>
        </div>
    </div>

    <!-- Action modal -->
    <div id="modal" class="wg-modal hidden">
        <div class="wg-modal-box">
            <h3 id="modalTitle">Action</h3>
            <p id="modalSub"></p>
            <input id="reasonInput" placeholder="Reason (optional)" />
            <div class="wg-modal-actions">
                <button id="modalCancel" class="btn-ghost">Cancel</button>
                <button id="modalConfirm" class="btn-danger">Confirm</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
